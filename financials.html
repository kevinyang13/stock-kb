<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Stock Signal Desk · Financials</title>
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<header class="mast">
  <h1>STOCK SIGNAL DESK</h1>
  <p>Financials — where the money goes</p>
  <nav class="tabs">
    <a class="tab" href="heatmap.html">Heatmap</a>
    <a class="tab" href="catalysts.html">Catalysts</a>
    <a class="tab" href="brief.html">Morning Brief</a>
    <a class="tab" href="events.html">Events</a>
    <a class="tab" href="financials.html">Financials</a>
    <a class="tab" href="tracker.html">Call Sheet</a>
  </nav>
</header>

<div class="wrap" id="fin">
  <div class="bar"><div class="status" id="fin-status"></div></div>
  <div class="chips" id="fin-chips"></div>
  <div id="fin-body"></div>
</div>

<footer>Prices are whatever the last reload returned &middot; not investment advice</footer>

<script src="assets/site.js"></script>
<script>
Site.nav();

(function () {
  var esc = Site.esc;
  var finLoaded = false;
  var bust = "";
  var finItems = [];
  var finPick = 0;

  function finCard(f) {
    var kpis = (f.highlights || []).map(function (h) {
      return '<div class="fin-kpi"><b>' + esc(h.k) + "</b>" +
        '<span class="v">' + esc(h.v) + "</span>" +
        (h.s ? '<span class="s">' + esc(h.s) + "</span>" : "") + "</div>";
    }).join("");
    var notes = (f.notes || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("");
    var src = f.sourceUrl
      ? '<a href="' + esc(f.sourceUrl) + '" target="_blank" rel="noopener">' + esc(f.source) + "</a>"
      : esc(f.source || "");
    return '<article class="fin-item">' +
      '<div class="fin-head">' +
        '<span class="tkr">' + esc(f.t) + "</span>" +
        "<h2>" + esc(f.company) + " &middot; " + esc(f.period) + "</h2>" +
        '<span class="per">' + [f.periodEnd, f.reported].filter(Boolean).map(esc).join(" &middot; ") + "</span>" +
      "</div>" +
      '<div class="fin-kpis">' + kpis + "</div>" +
      '<figure class="fin-fig"><a href="' + esc(f.img) + bust + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(f.img) + bust + '" alt="' + esc(f.company + " " + f.period + " income statement") + '">' +
      "</a></figure>" +
      (notes ? '<ul class="fin-notes">' + notes + "</ul>" : "") +
      '<p class="fin-src">Source: ' + src + "</p>" +
      "</article>";
  }

  function renderFin() {
    document.getElementById("fin-chips").innerHTML = finItems.map(function (f, i) {
      return '<button type="button" class="chip' + (i === finPick ? " on" : "") + '" data-i="' + i + '">' +
        esc(f.t) + '<span class="n">' + esc(f.period) + "</span></button>";
    }).join("");
    document.getElementById("fin-body").innerHTML = finItems.length ? finCard(finItems[finPick]) : "";
  }

  document.getElementById("fin-chips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    finPick = +chip.dataset.i;
    renderFin();
  });

  function loadFinancials() {
    if (finLoaded) return;
    finLoaded = true;

    var statusEl = document.getElementById("fin-status");
    statusEl.textContent = "loading financials...";

    fetch("financials.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("financials.json " + r.status);
        return r.json();
      })
      .then(function (doc) {
        finItems = doc.items || [];
        if (!finItems.length) {
          statusEl.innerHTML = "<b>No statements</b><br>nothing charted yet";
          return;
        }
        statusEl.innerHTML = "<b>" + esc(doc.generatedLabel || "") + "</b><br>" +
          finItems.length + " statement" + (finItems.length === 1 ? "" : "s") +
          (doc.note ? " &middot; " + esc(doc.note) : "");
        bust = doc.generated ? "?v=" + encodeURIComponent(doc.generated) : "";
        finPick = 0;
        renderFin();
      })
      .catch(function (err) {
        statusEl.innerHTML = "<b>Could not load financials</b><br>" + esc(String(err.message || err));
      });
  }

  loadFinancials();
})();
</script>
</body>
</html>
