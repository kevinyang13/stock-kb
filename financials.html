<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Stock Signal Desk · Financials</title>
<link rel="stylesheet" href="assets/site.css?v=1793058430">
</head>
<body>

<header class="mast">
  <h1>STOCK SIGNAL DESK</h1>
  <p>Financials — where the money goes</p>
  <nav class="tabs">
    <a class="tab" href="heatmap.html">Heatmap</a>
    <a class="tab" href="catalysts.html">Catalysts</a>
    <a class="tab" href="brief.html">Morning Brief</a>
    <a class="tab" href="events.html">Events</a>
    <a class="tab" href="financials.html">Financials</a>
    <a class="tab" href="tracker.html">Call Sheet</a>
  </nav>
</header>

<div class="wrap" id="fin">
  <div class="bar"><div class="status" id="fin-status"></div></div>
  <div class="chips" id="fin-chips"></div>
  <div id="fin-body"></div>
</div>

<footer>Prices are whatever the last reload returned &middot; not investment advice</footer>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<script src="assets/sankey.js?v=1793058430"></script>
<script src="assets/site.js?v=1793058430"></script>
<script>
Site.nav();

(function () {
  var esc = Site.esc;
  var finLoaded = false;
  var bust = "";
  var finItems = [];
  var finPick = 0;
  var chartEl = null;
  var debtEl = null;

  function finCard(f) {
    var kpis = (f.highlights || []).map(function (h) {
      return '<div class="fin-kpi"><b>' + esc(h.k) + "</b>" +
        '<span class="v">' + esc(h.v) + "</span>" +
        (h.s ? '<span class="s">' + esc(h.s) + "</span>" : "") + "</div>";
    }).join("");
    var notes = (f.notes || []).map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("");
    var src = f.sourceUrl
      ? '<a href="' + esc(f.sourceUrl) + '" target="_blank" rel="noopener">' + esc(f.source) + "</a>"
      : esc(f.source || "");
    return '<article class="fin-item">' +
      '<div class="fin-head">' +
        '<span class="tkr">' + esc(f.t) + "</span>" +
        "<h2>" + esc(f.company) + " &middot; " + esc(f.period) + "</h2>" +
        '<span class="per">' + [f.periodEnd, f.reported].filter(Boolean).map(esc).join(" &middot; ") + "</span>" +
      "</div>" +
      '<div class="fin-kpis">' + kpis + "</div>" +
      '<div class="fin-row">' +
        '<figure class="fin-fig"><div class="fin-chart" id="fin-chart"></div></figure>' +
        (f.debt
          ? '<figure class="fin-fig fin-fig-debt"><div class="fin-chart" id="fin-debt"></div></figure>'
          : "") +
      "</div>" +
      '<div class="fin-tools">' +
        '<div class="zoom" id="fin-zoom">' +
          '<button type="button" data-z="out" title="Zoom out" aria-label="Zoom out">&minus;</button>' +
          '<button type="button" data-z="fit" class="fit">Fit</button>' +
          '<button type="button" data-z="in" title="Zoom in" aria-label="Zoom in">+</button>' +
        '</div>' +
        '<p class="fin-raster">Hover for values &middot; ' +
          '<span class="hint">&#8984;/ctrl + scroll to zoom, drag to pan</span> &middot; ' +
          '<a href="' + esc(f.img) + bust + '" target="_blank" rel="noopener">open as an image</a></p>' +
      "</div>" +
      (notes ? '<ul class="fin-notes">' + notes + "</ul>" : "") +
      '<p class="fin-src">Source: ' + src + "</p>" +
      "</article>";
  }

  function renderFin() {
    document.getElementById("fin-chips").innerHTML = finItems.map(function (f, i) {
      return '<button type="button" class="chip' + (i === finPick ? " on" : "") + '" data-i="' + i + '">' +
        esc(f.t) + '<span class="n">' + esc(f.period) + "</span></button>";
    }).join("");
    var body = document.getElementById("fin-body");
    if (chartEl) Sankey.unmount(chartEl);   // innerHTML is about to drop it
    if (debtEl) Sankey.unmount(debtEl);
    chartEl = debtEl = null;
    body.innerHTML = finItems.length ? finCard(finItems[finPick]) : "";
    if (finItems.length) {
      drawChart(finItems[finPick]);
      drawDebt(finItems[finPick]);
    }
  }

  // The debt/coverage bars, for the names where the balance sheet is the
  // story the income statement does not tell. Same figure-JSON pipeline as
  // the sankey, so it rescales and hovers the same way. No raster fallback:
  // the card still reads without it.
  function drawDebt(f) {
    debtEl = document.getElementById("fin-debt");
    if (!debtEl || !f.debt) { debtEl = null; return; }
    if (typeof Plotly === "undefined" || typeof Sankey === "undefined") return;

    var el = debtEl;
    Sankey.load(f.debt)
      .then(function (fig) {
        if (el !== debtEl) return;         // the ticker changed while fetching
        Sankey.mount(el, fig);
      })
      .catch(function () {
        if (el === debtEl && el.parentElement) el.parentElement.remove();
      });
  }

  // The chart ships as the figure JSON bin/sankey.py writes with --json, so
  // hovering a band gives its exact value. The PNG is still generated and
  // stands in whenever the JSON or plotly itself does not arrive.
  function drawChart(f) {
    chartEl = document.getElementById("fin-chart");
    if (!chartEl) return;
    var stem = f.chart || f.img.split("/").pop().replace(/\.png$/, "");
    var el = chartEl;

    if (typeof Plotly === "undefined" || typeof Sankey === "undefined") {
      rasterFallback(el, f, "plotly did not load");
      return;
    }
    Sankey.load(stem)
      .then(function (fig) {
        if (el !== chartEl) return;        // the ticker changed while fetching
        Sankey.mount(el, fig, paintZoom);
        wireZoomButtons(el);
      })
      .catch(function (err) {
        if (el !== chartEl) return;
        rasterFallback(el, f, String(err.message || err));
      });
  }

  function paintZoom(z, state) {
    var bar = document.getElementById("fin-zoom");
    if (!bar) return;
    bar.querySelector('[data-z="out"]').disabled = state.atMin;
    bar.querySelector('[data-z="in"]').disabled = state.atMax;
    var fit = bar.querySelector(".fit");
    fit.disabled = state.atFit;
    fit.textContent = state.atFit ? "Fit" : Math.round(z * 100) + "%";
  }

  function wireZoomButtons(el) {
    var bar = document.getElementById("fin-zoom");
    if (!bar) return;
    bar.addEventListener("click", function (e) {
      var b = e.target.closest("button");
      if (!b || el !== chartEl) return;
      if (b.dataset.z === "fit") Sankey.setZoom(el, Sankey.FIT);
      else Sankey.step(el, b.dataset.z === "in" ? 1 : -1);
    });
  }

  function rasterFallback(el, f, why) {
    el.parentElement.innerHTML =
      '<img src="' + esc(f.img) + bust + '" alt="' +
      esc(f.company + " " + f.period + " income statement") + '">';
    var cap = document.querySelector(".fin-raster");
    if (cap) cap.innerHTML = "Showing the image instead &mdash; " + esc(why);
  }

  document.getElementById("fin-chips").addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;
    finPick = +chip.dataset.i;
    renderFin();
  });

  function loadFinancials() {
    if (finLoaded) return;
    finLoaded = true;

    var statusEl = document.getElementById("fin-status");
    statusEl.textContent = "loading financials...";

    fetch("financials.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("financials.json " + r.status);
        return r.json();
      })
      .then(function (doc) {
        finItems = doc.items || [];
        if (!finItems.length) {
          statusEl.innerHTML = "<b>No statements</b><br>nothing charted yet";
          return;
        }
        statusEl.innerHTML = "<b>" + esc(doc.generatedLabel || "") + "</b><br>" +
          finItems.length + " statement" + (finItems.length === 1 ? "" : "s") +
          (doc.note ? " &middot; " + esc(doc.note) : "");
        bust = doc.generated ? "?v=" + encodeURIComponent(doc.generated) : "";
        finPick = 0;
        renderFin();
      })
      .catch(function (err) {
        statusEl.innerHTML = "<b>Could not load financials</b><br>" + esc(String(err.message || err));
      });
  }

  loadFinancials();
})();
</script>
</body>
</html>
