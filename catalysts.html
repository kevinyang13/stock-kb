<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<title>Stock Signal Desk · Catalysts</title>
<link rel="stylesheet" href="assets/site.css?v=1793411929">
<style>
  /* A stale tab that looks current is worse than an empty one. Past the
     threshold this says so at full width, above everything else. */
  .stale-ban{
    display:none;margin:8px 2px 4px;padding:10px 14px;border-radius:8px;
    background:#5a1f1a;border:1px solid #b4433b;color:#f3e7e4;
    font-family:var(--sans);font-size:12.5px;line-height:1.55;
  }
  .stale-ban.on{display:block}
  .stale-ban b{color:#fff;letter-spacing:.06em;text-transform:uppercase;font-size:11px}
</style>
</head>
<body>

<header class="mast">
  <h1>STOCK SIGNAL DESK</h1>
  <p>Catalysts — what moved, and why</p>
  <nav class="tabs">
    <a class="tab" href="heatmap.html">Heatmap</a>
    <a class="tab" href="catalysts.html">Catalysts</a>
    <a class="tab" href="brief.html">Morning Brief</a>
    <a class="tab" href="events.html">Events</a>
    <a class="tab" href="financials.html">Financials</a>
    <a class="tab" href="map.html">Data Centers</a>
  </nav>
</header>

<div class="wrap" id="news">
  <div class="stale-ban" id="stale"></div>
  <div class="bar">
    <div class="status" id="news-status"></div>
  </div>
  <div class="cards" id="cards"></div>
</div>

<footer>Prices are whatever the last reload returned &middot; not investment advice</footer>

<script src="assets/site.js?v=1793411929"></script>
<script>
Site.nav();

(function () {
  var esc = Site.esc, sectorLabel = Site.sectorLabel;
  var statusEl = document.getElementById("news-status");
  var cards = document.getElementById("cards");
  var meta = {}, doc = null, quotes = {};

  // The sweep that writes news.json is a cloud routine and it has failed
  // before. When it does, this page keeps rendering its last successful run
  // and looks exactly as it does when it is current -- which is the dangerous
  // part. Past three days it says so, in words, at the top.
  var STALE_DAYS = 3;

  function staleness(doc) {
    var el = document.getElementById("stale");
    var when = doc.generated ? new Date(doc.generated) : null;
    if (!when || isNaN(when)) return;
    var days = Math.floor((Date.now() - when.getTime()) / 86400000);
    if (days < STALE_DAYS) return;
    el.className = "stale-ban on";
    el.innerHTML =
      "<b>Stale &middot; " + days + " days old</b><br>" +
      "These catalysts were swept on " +
      esc(doc.generatedLabel || when.toDateString()) +
      " and nothing here reflects anything after that date. The sweep that " +
      "refreshes this tab has not run since. Check the Financials and Events " +
      "tabs, which are maintained by hand, before reading an empty Catalysts " +
      "page as quiet news.";
  }

  function card(n) {
    var q = quotes[n.t];
    var move = q && q.pct !== null && q.pct !== undefined
      ? '<span class="move ' + (q.pct >= 0 ? "up" : "down") + '">' +
        (q.pct >= 0 ? "+" : "") + q.pct.toFixed(2) + "%</span>"
      : "";
    var m = meta[n.t];
    return '<article class="card">' +
      "<h3>" +
        '<a href="https://www.tradingview.com/symbols/' + encodeURIComponent(n.t) +
        '/" target="_blank" rel="noopener noreferrer">' + esc(n.t) + "</a>" + move +
      "</h3>" +
      '<div class="sector">' + esc(m ? sectorLabel(m) : "") + "</div>" +
      "<p>" + esc(n.summary || "") + "</p>" +
      (n.headlines && n.headlines.length
        ? "<ul>" + n.headlines.map(function (h) { return "<li>" + esc(h) + "</li>"; }).join("") + "</ul>"
        : "") +
    "</article>";
  }

  function render() {
    cards.innerHTML = (doc.items || []).map(card).join("");
  }

  statusEl.textContent = "loading catalysts...";

  Promise.all([
    Site.watchlist(),
    fetch("news.json", { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error("news.json " + r.status);
      return r.json();
    }),
  ]).then(function (both) {
    both[0].symbols.forEach(function (s) { meta[s.t] = s; });
    doc = both[1];
    var items = doc.items || [];
    if (!items.length) {
      statusEl.innerHTML = "<b>No catalysts</b><br>nothing moved on news in the last run";
      return;
    }
    statusEl.innerHTML = "<b>" + esc(doc.generatedLabel || doc.generated || "") + "</b>" +
      "<br>" + items.length + " with a catalyst &middot; source: " + esc(doc.source || "");
    staleness(doc);
    render();

    // day moves for just these tickers, then redraw
    var syms = items.map(function (n) { return n.t; });
    Site.prices(syms, function (sym, price, pct) {
      quotes[sym] = { price: price, pct: pct };
    }, function () {}).then(render);
  }).catch(function (e) {
    statusEl.className = "status bad";
    statusEl.innerHTML = "<b>could not load catalysts</b><br>" + esc(e.message) +
      " -- this page needs to be served over http, not opened from disk";
  });
})();
</script>
</body>
</html>
