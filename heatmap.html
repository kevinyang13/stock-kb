<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchlist Heatmap</title>
<style>
  :root{
    --teal-deep:#073933;
    --teal:#0a4640;
    --teal-head:#326b64;
    --teal-line:#14574f;
    --gold:#d3a24d;
    --cream:#eae5df;
    --cream-dim:#c8c2ba;
    --ink:#12312c;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:"Helvetica Neue",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--teal);color:var(--cream);font-family:var(--serif)}

  header.mast{
    background:var(--teal-head);border-bottom:2px solid var(--gold);
    padding:9px 14px;display:flex;align-items:baseline;gap:12px;
  }
  .mast h1{
    margin:0;font-size:20px;line-height:1;color:var(--gold);
    font-weight:400;letter-spacing:.14em;
  }
  .mast p{margin:0;font-family:var(--sans);font-size:11px;color:var(--cream-dim)}

  .wrap{max-width:none;margin:0;padding:0 8px}

  .tabs{display:flex;gap:4px;margin-left:auto}
  .tab{
    font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:7px 16px;border-radius:999px;cursor:pointer;
    background:transparent;border:1px solid var(--teal-line);color:var(--cream-dim);
  }
  .tab:hover{border-color:var(--gold);color:var(--cream)}
  .tab.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}

  .cards{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(330px,1fr));
    gap:8px;
    padding-bottom:12px;
    max-width:1500px;
  }
  .card{
    background:var(--teal-deep);
    border:1px solid var(--teal-line);
    border-left:3px solid var(--gold);
    padding:14px 16px 16px;
  }
  .card h3{
    margin:0 0 2px;font-size:22px;font-weight:400;letter-spacing:.05em;
    display:flex;align-items:baseline;gap:8px;
  }
  .card h3 a{color:var(--gold);text-decoration:none}
  .card h3 a:hover{text-decoration:underline}
  .card h3 .move{font-family:var(--sans);font-size:13px;font-variant-numeric:tabular-nums}
  .card h3 .move.up{color:var(--green)}
  .card h3 .move.down{color:var(--red)}
  .card .sector{
    font-family:var(--sans);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--cream-dim);margin-bottom:9px;
  }
  .card p{
    margin:0 0 10px;font-family:var(--sans);font-size:13.5px;line-height:1.55;color:var(--cream);
  }
  .card ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .card li{
    font-family:var(--sans);font-size:12px;line-height:1.5;color:var(--cream-dim);
    padding-left:13px;position:relative;
  }
  .card li:before{content:"\203A";position:absolute;left:0;color:var(--gold)}

  /* ---------- morning brief ---------- */
  .brief-body{max-width:1180px;padding-bottom:20px;font-family:var(--sans)}
  .brief-body h2{
    font-family:var(--serif);font-weight:400;font-size:23px;letter-spacing:.03em;
    color:var(--cream);margin:26px 0 3px;padding-bottom:5px;
    border-bottom:1px solid var(--teal-line);
  }
  .brief-body h2 .num{color:var(--gold);font-size:15px;margin-right:9px;letter-spacing:.1em}
  .brief-body h2:first-child{margin-top:6px}

  .quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px;margin-top:10px}
  .quotes div{background:var(--teal-deep);padding:11px 12px}
  .quotes .n{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--cream-dim)}
  .quotes .v{font-size:19px;font-variant-numeric:tabular-nums;margin-top:3px}
  .quotes .c{font-size:12px;font-variant-numeric:tabular-nums;margin-top:1px}

  .rows{display:flex;flex-direction:column;gap:1px;margin-top:10px}
  .row{
    display:grid;grid-template-columns:78px 74px 1fr;gap:12px;align-items:baseline;
    background:var(--teal-deep);padding:10px 12px;font-size:13px;line-height:1.5;
  }
  .row .tk{font-family:var(--serif);font-size:17px;color:var(--gold);letter-spacing:.05em}
  .row .pc{font-variant-numeric:tabular-nums;font-size:13px}
  .row .tx{color:var(--cream-dim)}
  .row .tx b{color:var(--cream);font-weight:700}

  .sect{margin-top:10px;display:flex;flex-direction:column;gap:1px}
  .sect .s{background:var(--teal-deep);padding:12px 14px}
  .sect .s h4{
    margin:0 0 5px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    display:flex;gap:10px;align-items:baseline;
  }
  .sect .s h4 .avg{font-variant-numeric:tabular-nums;letter-spacing:0}
  .sect .s p{margin:0;font-size:13px;line-height:1.6;color:var(--cream)}

  .bullets{margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:1px}
  .bullets li{
    background:var(--teal-deep);padding:10px 12px 10px 26px;position:relative;
    font-size:13px;line-height:1.55;color:var(--cream);
  }
  .bullets li:before{content:"\203A";position:absolute;left:12px;color:var(--gold)}
  .bullets li .when{color:var(--cream-dim);font-size:11px;letter-spacing:.06em}

  .declined{
    border:1px solid var(--gold);border-left-width:3px;background:rgba(211,162,77,.10);
    padding:14px 16px;margin-top:10px;font-size:13px;line-height:1.6;color:var(--cream);
  }
  .declined b{color:var(--gold)}

  .up{color:var(--green)} .down{color:var(--red)}

  /* ---------- events ---------- */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;margin-top:6px;font-family:var(--sans)}
  .cal .dow{
    font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);
    padding:6px 8px;text-align:left;
  }
  .cal .day{
    background:var(--teal-deep);min-height:96px;padding:7px 8px;
    display:flex;flex-direction:column;gap:4px;
  }
  .cal .day.out{background:rgba(7,57,51,.35)}
  .cal .day.today{outline:1px solid var(--gold);outline-offset:-1px}
  .cal .day .d{font-size:11px;color:var(--cream-dim);font-variant-numeric:tabular-nums}
  .cal .day.today .d{color:var(--gold);font-weight:700}

  .ev{
    font-size:10.5px;line-height:1.35;padding:3px 5px;border-radius:2px;
    border-left:2px solid var(--gold);background:rgba(211,162,77,.10);color:var(--cream);
  }
  .ev.earnings{border-left-color:#e0b25c;background:rgba(224,178,92,.14)}
  .ev.exdiv{border-left-color:var(--green);background:rgba(95,176,138,.13)}
  .ev.fed{border-left-color:#8fb8ff;background:rgba(143,184,255,.14)}
  .ev.macro{border-left-color:#c9a0ff;background:rgba(201,160,255,.13)}
  .ev .s{color:var(--gold);font-weight:700}
  .ev.fav .s:after{content:" \2605"}

  .weeklist{display:flex;flex-direction:column;gap:1px;margin-top:6px;font-family:var(--sans)}
  .weeklist .wday{background:var(--teal-deep);padding:11px 14px;display:grid;
    grid-template-columns:132px 1fr;gap:14px;align-items:baseline}
  .weeklist .wday.today{outline:1px solid var(--gold);outline-offset:-1px}
  .weeklist .wday .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--cream-dim)}
  .weeklist .wday.today .lab{color:var(--gold)}
  .weeklist .wday .items{display:flex;flex-wrap:wrap;gap:5px}
  .weeklist .wday .none{color:var(--teal-line);font-size:12px}

  .legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-family:var(--sans);
    font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--cream-dim)}
  .legend span:before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;
    vertical-align:baseline;border-radius:1px}
  .legend .e:before{background:#e0b25c}
  .legend .d:before{background:var(--green)}
  .legend .f:before{background:#8fb8ff}
  .legend .m:before{background:#c9a0ff}

  .bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    padding:10px 0 8px;
  }
  .bar .spacer{flex:1}
  .status{font-family:var(--sans);font-size:12px;color:var(--cream-dim);line-height:1.5}
  .status b{color:var(--gold);font-weight:700}
  .status.bad b{color:#e8836d}

  button,select{
    font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
    padding:11px 20px;border-radius:999px;border:1px solid var(--gold);
    background:var(--gold);color:var(--ink);cursor:pointer;white-space:nowrap;
  }
  button.ghost,select{background:transparent;color:var(--gold)}
  button:hover{opacity:.85}
  button[disabled]{opacity:.5;cursor:progress}
  select{padding:10px 14px;border-radius:999px}

  .chips{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:10px}
  .chip{
    font-family:var(--sans);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;
    background:transparent;border:1px solid var(--teal-line);color:var(--cream-dim);
  }
  .chip:hover{border-color:var(--gold);color:var(--cream)}
  .chip.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
  .chip .n{opacity:.6;margin-left:6px}
  .chip.on .n{opacity:.75}
  .none{
    padding:40px 20px;text-align:center;color:var(--cream-dim);
    font-family:var(--sans);font-size:14px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(104px,1fr));
    gap:2px;
    padding-bottom:8px;
  }
  .tile{
    padding:11px 6px 12px;
    text-align:center;
    font-family:var(--sans);
    color:#fff;
    border-radius:2px;
    min-height:90px;
    display:flex;flex-direction:column;justify-content:center;gap:3px;
  }
  .tile .t{font-size:14px;font-weight:700;letter-spacing:.03em}
  .tile .p{font-size:13px;font-variant-numeric:tabular-nums}
  .tile .c{font-size:12px;font-variant-numeric:tabular-nums;opacity:.95}
  .tile{position:relative;text-decoration:none;transition:transform .08s ease,box-shadow .08s ease}
  .tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.45);z-index:1}

  /* Favorites: colour on this board already means the day's move, so a
     favorite is marked with a star alone -- no border competing with it. */
  .tile .star{
    position:absolute;top:5px;right:7px;
    font-size:13px;line-height:1;color:var(--gold);
    text-shadow:0 1px 3px rgba(0,0,0,.7);
  }
  .tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .tile.stale{opacity:.45}
  .tile.waiting .p,.tile.waiting .c{opacity:.35}
  .tile .t small{display:block;font-size:9px;letter-spacing:.12em;opacity:.72;margin-top:3px;font-weight:400;text-transform:uppercase}
  .tile .t small.warn{opacity:.55;text-transform:none;letter-spacing:.06em}

  footer{
    background:var(--gold);color:var(--ink);text-align:center;
    padding:10px 16px;margin-top:14px;
    font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  }
</style>
</head>
<body>

<header class="mast">
  <h1>HEATMAP</h1>
  <p>colored by the day's move</p>
  <nav class="tabs" id="tabs">
    <button type="button" class="tab on" data-panel="board">Heatmap</button>
    <button type="button" class="tab" data-panel="news">Catalysts</button>
    <button type="button" class="tab" data-panel="brief">Morning Brief</button>
    <button type="button" class="tab" data-panel="events">Events</button>
  </nav>
</header>

<div class="wrap" id="board">
  <div class="bar">
    <button type="button" id="reload">Reload prices</button>
    <select id="view" aria-label="What the colors mean">
      <option value="move">Color: day move</option>
      <option value="pe">Color: forward P/E</option>
    </select>
    <select id="sort" aria-label="Tile order">
      <option value="list">Watchlist order</option>
      <option value="best">Best first</option>
      <option value="worst">Worst first</option>
      <option value="sector">Sector order</option>
      <option value="cheap">Cheapest P/E</option>
      <option value="rich">Priciest P/E</option>
    </select>
    <span class="spacer"></span>
    <div class="status" id="status"></div>
  </div>

  <div class="chips" id="chips"></div>

  <div class="grid" id="grid"></div>
  <div class="none" id="none" hidden>Nothing in that combination.</div>
</div>

<div class="wrap" id="events" hidden>
  <div class="bar">
    <select id="ev-range" aria-label="Calendar range">
      <option value="week">This week</option>
      <option value="month" selected>This month</option>
    </select>
    <select id="ev-kind" aria-label="Event type">
      <option value="all">All events</option>
      <option value="earnings">Earnings</option>
      <option value="exdiv">Dividends</option>
      <option value="macro">Macro + Fed</option>
      <option value="fav">Favorites only</option>
    </select>
    <span class="spacer"></span>
    <div class="status" id="ev-status"></div>
  </div>
  <div id="ev-body"></div>
</div>

<div class="wrap" id="brief" hidden>
  <div class="bar"><div class="status" id="brief-status"></div></div>
  <div class="brief-body" id="brief-body"></div>
</div>

<div class="wrap" id="news" hidden>
  <div class="bar">
    <div class="status" id="news-status"></div>
  </div>
  <div class="cards" id="cards"></div>
</div>

<footer>Prices are whatever the last reload returned &middot; not investment advice</footer>

    { "t": "SKHY",  "sector": "AI Memory", "pe": 4.05, "tags": ["Semiconductor", "AI Memory", "AI Infra"] },
    { "t": "COHR",  "pe": 28.89, "tags": ["Semiconductor", "AI Infra", "Networking", "Hardware"] },
    { "t": "NET",   "pe": 193.19, "tags": ["Cloud", "Software", "Networking", "AI Infra"] },
    { "t": "DDOG",  "pe": 84.56, "tags": ["Software", "Cloud", "AI"] },
    { "t": "NU",    "pe": 14.93, "tags": ["Fintech"] }
  ]
}
</script>

<script>
(function () {
  "use strict";

  var doc = JSON.parse(document.getElementById("watchlist").textContent);
  var quotes = doc.symbols.map(function (q) {
    return { t: q.t, tags: q.tags, fav: !!q.fav, sector: q.sector || null,
             pe: q.pe === undefined ? null : q.pe,
             price: null, pct: null };
  });
  var asOf = "loading";
  var note = "";
  var bad = false;

  var picked = [];   // categories currently switched on; empty means everything

  var grid = document.getElementById("grid");
  var chipsEl = document.getElementById("chips");
  var noneEl = document.getElementById("none");
  var statusEl = document.getElementById("status");
  var sortEl = document.getElementById("sort");
  var viewEl = document.getElementById("view");
  var reloadBtn = document.getElementById("reload");

  // Tile color: hue by direction, intensity by size of the move.
  // Anything at or past 4% is painted at full strength.
  // Forward P/E on a single ramp, deep teal (cheap) to gold (expensive).
  // Deliberately not red/green -- a high multiple is not a down day, and
  // reusing the move palette would say something the number does not.
  function shadePe(pe) {
    if (pe === null || pe === undefined || isNaN(pe)) return "#0e2f2b";
    var t = Math.max(0, Math.min(1, (pe - 8) / 42));   // 8x floor, 50x ceiling
    var hue = 172 - t * 132;                           // teal -> gold
    return "hsl(" + hue.toFixed(0) + "," + (34 + t * 30).toFixed(0) + "%," +
           (13 + t * 24).toFixed(0) + "%)";
  }

  function shade(pct) {
    if (pct === null || pct === undefined || isNaN(pct)) return "#123c37";
    var mag = Math.min(Math.abs(pct), 4) / 4;
    var light = 11 + mag * 27;
    var sat = 45 + mag * 40;
    return "hsl(" + (pct >= 0 ? 141 : 2) + "," + sat.toFixed(0) + "%," + light.toFixed(0) + "%)";
  }

  function money(n) {
    if (n === null || n === undefined || isNaN(n)) return "--";
    return "$" + Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function peText(pe) {
    return pe === null ? "no P/E" : pe.toFixed(1) + "x fwd";
  }

  function pctText(p) {
    if (p === null || p === undefined || isNaN(p)) return "\u2014";
    return (p >= 0 ? "+" : "") + Number(p).toFixed(2) + "%";
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // A ticker shows when it carries ANY switched-on category, so picking
  // "AI" plus "Semiconductor" widens the view rather than narrowing it.
  function matches(q) {
    if (!picked.length) return true;
    var tags = q.tags || [];
    for (var i = 0; i < picked.length; i++) {
      if (tags.indexOf(picked[i]) !== -1) return true;
    }
    return false;
  }

  function renderChips() {
    var count = {};
    quotes.forEach(function (q) {
      (q.tags || []).forEach(function (t) { count[t] = (count[t] || 0) + 1; });
    });

    var tags = Object.keys(count).sort(function (a, b) {
      return count[b] - count[a] || a.localeCompare(b);
    });

    chipsEl.innerHTML =
      '<button class="chip' + (picked.length ? "" : " on") + '" data-tag="">' +
        'All<span class="n">' + quotes.length + "</span></button>" +
      tags.map(function (t) {
        return '<button class="chip' + (picked.indexOf(t) !== -1 ? " on" : "") +
               '" data-tag="' + esc(t) + '">' + esc(t) +
               '<span class="n">' + count[t] + "</span></button>";
      }).join("");
  }

  function peOf(q) { return q.pe === null || q.pe === undefined ? null : q.pe; }

  // Sector reading order: the AI and silicon complex first, then the
  // machines, then what they are launched and pointed at, then the rest of
  // the book. A ticker carries several tags, so its sector is simply the
  // highest-ranked tag it holds -- NVDA reads as AI, not as Physical AI.
  var SECTORS = [
    "AI", "AI Infra", "AI Memory", "Semiconductor",
    "Robotics", "Physical AI",
    "Space", "Defense", "Aerospace",
    "Quantum",
    "Software", "Cloud", "Data Center", "Networking", "Hardware",
    "Crypto", "Mining", "Fintech",
    "Consumer Tech", "Media", "Retail",
    "Telecom", "Energy", "Nuclear", "Industrials", "Auto", "Homebuilder",
    "ETF", "Fund", "Broad Market", "Leveraged", "Private Tech", "SPAC",
    "Unclassified"
  ];

  function sectorRank(q) {
    if (q.sector) {                      // an explicit sector wins outright
      var at = SECTORS.indexOf(q.sector);
      if (at !== -1) return at;
    }
    var best = SECTORS.length;
    (q.tags || []).forEach(function (t) {
      var at = SECTORS.indexOf(t);
      if (at !== -1 && at < best) best = at;
    });
    return best;
  }

  // The label under a ticker. With categories switched on it names the one
  // that put the tile on screen, so the board explains its own filtering;
  // otherwise it names the ticker's primary sector.
  function sectorLabel(q) {
    var tags = q.tags || [];
    var pool = tags;

    // A ticker can name its own sector when the ranking would pick a tag
    // that is true but not what the company is -- MU carries AI Infra, but
    // it is a memory maker.
    if (q.sector && !picked.length) return q.sector;

    if (picked.length) {
      var hit = tags.filter(function (t) { return picked.indexOf(t) !== -1; });
      if (hit.length) pool = hit;
    }

    var best = null, bestAt = SECTORS.length + 1;
    pool.forEach(function (t) {
      var at = SECTORS.indexOf(t);
      if (at === -1) at = SECTORS.length;      // unranked tags still label
      if (at < bestAt) { bestAt = at; best = t; }
    });
    return best;
  }

  function ordered() {
    var list = quotes.filter(matches);
    if (sortEl.value === "best") {
      list.sort(function (a, b) { return (b.pct === null ? -99 : b.pct) - (a.pct === null ? -99 : a.pct); });
    } else if (sortEl.value === "worst") {
      list.sort(function (a, b) { return (a.pct === null ? 99 : a.pct) - (b.pct === null ? 99 : b.pct); });
    } else if (sortEl.value === "sector") {
      var byPe = viewEl.value === "pe";
      list.sort(function (a, b) {
        var d = sectorRank(a) - sectorRank(b);
        if (d) return d;
        if (byPe) {                       // inside a sector: cheapest first
          var x = peOf(a), y = peOf(b);
          if (x === null && y === null) return a.t.localeCompare(b.t);
          if (x === null) return 1;
          if (y === null) return -1;
          return x - y;
        }
        var m = (b.pct === null ? -99 : b.pct) - (a.pct === null ? -99 : a.pct);
        return m || a.t.localeCompare(b.t);
      });
    } else if (sortEl.value === "cheap" || sortEl.value === "rich") {
      var dir = sortEl.value === "cheap" ? 1 : -1;
      list.sort(function (a, b) {
        var x = peOf(a), y = peOf(b);
        if (x === null && y === null) return 0;
        if (x === null) return 1;            // no P/E always sorts last
        if (y === null) return -1;
        return (x - y) * dir;
      });
    }
    return list;
  }

  function render() {
    var shown = ordered();
    noneEl.hidden = shown.length !== 0;

    renderChips();

    grid.innerHTML = shown.map(function (q) {
      var peView = viewEl.value === "pe";
      var dead = peView ? peOf(q) === null : (q.pct === null || q.pct === undefined);
      var waiting = dead && !q.err && !peView;
      return '<a class="tile' + (dead ? " stale" : "") + (waiting ? " waiting" : "") +
        (q.fav ? " fav" : "") + '" style="background:' + (peView ? shadePe(peOf(q)) : shade(q.pct)) + '"' +
        ' href="https://www.tradingview.com/symbols/' + encodeURIComponent(q.t) + '/"' +
        ' target="_blank" rel="noopener noreferrer"' +
        ' title="' + esc(q.t) + (q.fav ? " (favorite)" : "") +
        (q.tags && q.tags.length ? " -- " + esc(q.tags.join(", ")) : "") +
        (q.err ? " -- " + esc(q.err) : "") + '">' +
        (q.fav ? '<span class="star" aria-hidden="true">\u2605</span>' : "") +
        '<div class="t">' + esc(q.t) +
          (sectorLabel(q) ? "<small>" + esc(sectorLabel(q)) + "</small>" : "") +
        "</div>" +
        '<div class="p">' + money(q.price) + "</div>" +
        '<div class="c">' +
          (q.err && !peView ? esc(q.err) : (peView ? peText(peOf(q)) : pctText(q.pct))) +
        "</div>" +
      "</a>";
    }).join("");

    statusEl.className = "status" + (bad ? " bad" : "");
    var peCount = quotes.filter(function (q) { return peOf(q) !== null; }).length;
    statusEl.innerHTML = "<b>" + esc(asOf) + "</b>" +
      (viewEl.value === "pe"
        ? " &middot; forward P/E for " + peCount + " of " + quotes.length +
          (doc.peAsOf ? ", read " + esc(doc.peAsOf) : "")
        : "") +
      (picked.length ? " &middot; showing " + shown.length + " of " + quotes.length : "") +
      (note ? "<br>" + esc(note) : "");
  }

  // Quote sources that work from a browser are scarce: most services
  // (CNBC, Yahoo, Nasdaq, Stooq) answer curl happily but drop their CORS
  // header for a real cross-origin page request. stockanalysis.com does
  // not, so it is the primary. It has no batch endpoint, hence one small
  // request per symbol, eight in flight at a time.
  var LANES = 6;

  // One pass over a list of symbols. Anything that does not come back with a
  // price is returned as a miss rather than written off, so it can be retried.
  function quotePass(syms, lanes, onQuote) {
    var next = 0, missed = [];

    function pump() {
      if (next >= syms.length) return Promise.resolve();
      var sym = syms[next++];

      return fetch("https://stockanalysis.com/api/quotes/s/" +
                   encodeURIComponent(sym.toLowerCase()), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) {
          var d = j && j.status === 200 ? j.data : null;
          if (d && isFinite(d.p)) {
            onQuote(sym, Number(d.p), isFinite(d.cp) ? Number(d.cp) : null);
          } else {
            missed.push(sym);
          }
        })
        .catch(function () { missed.push(sym); })
        .then(pump);
    }

    var running = [];
    for (var i = 0; i < lanes; i++) running.push(pump());
    return Promise.all(running).then(function () { return missed; });
  }

  function wait(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  // A hundred symbols in quick succession can get the whole run rate-limited,
  // and a limited request looks exactly like a symbol with no data. So retry
  // the misses twice, slower and narrower each time, before calling them dry.
  function fromStockAnalysis(syms, onQuote, onProgress) {
    return quotePass(syms, LANES, onQuote)
      .then(function (missed) {
        if (!missed.length) return [];
        onProgress(syms.length - missed.length, syms.length, "retrying " + missed.length);
        return wait(1500).then(function () { return quotePass(missed, 3, onQuote); });
      })
      .then(function (missed) {
        if (!missed.length) return [];
        onProgress(syms.length - missed.length, syms.length, "retrying " + missed.length);
        return wait(4000).then(function () { return quotePass(missed, 2, onQuote); });
      })
      .then(function (missed) { return syms.length - missed.length; });
  }

  // Local fallback: quotes.py fetches server-side, where CORS never applies,
  // and covers names stockanalysis.com does not carry.
  function fromProxy(syms, onQuote) {
    return fetch("api/quotes?symbols=" + encodeURIComponent(syms.join(",")), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("proxy " + r.status);
        return r.json();
      })
      .then(function (data) {
        var hits = 0;
        (data.quotes || []).forEach(function (q) {
          if (!q.error) { hits++; onQuote(q.symbol, q.price, q.pct); }
        });
        return hits;
      });
  }

  var pending = false;
  function renderSoon() {
    if (pending) return;
    pending = true;
    setTimeout(function () { pending = false; render(); }, 120);
  }

  function apply(sym, price, pct) {
    for (var i = 0; i < quotes.length; i++) {
      if (quotes[i].t === sym) {
        quotes[i].price = price;
        quotes[i].pct = pct;
        quotes[i].err = null;
        break;
      }
    }
    renderSoon();
  }

  function reload() {
    var syms = quotes.map(function (q) { return q.t; });
    reloadBtn.disabled = true;
    bad = false;
    asOf = "loading";
    note = "fetching " + syms.length + " symbols...";
    render();

    fromStockAnalysis(syms, apply, function (done, total, what) {
      note = done + " of " + total + " priced, " + what + "...";
      render();
    })
      .then(function (hits) {
        if (hits) return { hits: hits, source: "stockanalysis.com" };
        return fromProxy(syms, apply).then(function (n) {
          return { hits: n, source: "local proxy" };
        });
      })
      .then(function (res) {
        asOf = new Date().toLocaleString();
        note = "source: " + res.source + " -- " + res.hits + " of " + syms.length + " priced";
        bad = res.hits === 0;
        if (!res.hits) note = "no quote service answered";
      })
      .catch(function (e) {
        bad = true;
        note = "could not reach a quote service (" + e.message + ")";
      })
      .then(function () {
        reloadBtn.disabled = false;
        quotes.forEach(function (q) {
          if (q.price === null && !q.err) q.err = "no quote";
        });
        render();
      });
  }

  chipsEl.addEventListener("click", function (e) {
    var chip = e.target.closest(".chip");
    if (!chip) return;

    var tag = chip.dataset.tag;
    if (!tag) {
      picked = [];                       // "All" clears the selection
    } else {
      var at = picked.indexOf(tag);
      if (at === -1) picked.push(tag);
      else picked.splice(at, 1);
    }
    render();
  });

  sortEl.addEventListener("change", render);
  viewEl.addEventListener("change", render);

  // ---------------------------------------------------------------- catalysts

  // news.json is written by the weekday routine, which asks each favorite's
  // page what is driving it and keeps only the ones with an answer. Loaded
  // over http; opening this file straight from disk cannot read it.
  var newsLoaded = false;

  function loadNews() {
    if (newsLoaded) return;
    newsLoaded = true;

    var statusEl = document.getElementById("news-status");
    var cards = document.getElementById("cards");
    statusEl.textContent = "loading catalysts...";

    fetch("news.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("news.json " + r.status);
        return r.json();
      })
      .then(function (doc) {
        var items = doc.items || [];
        if (!items.length) {
          statusEl.innerHTML = "<b>No catalysts</b><br>nothing moved on news in the last run";
          return;
        }

        statusEl.innerHTML = "<b>" + esc(doc.generatedLabel || doc.generated || "") + "</b>" +
          "<br>" + items.length + " with a catalyst &middot; source: " + esc(doc.source || "");

        cards.innerHTML = items.map(function (n) {
          var q = quotes.filter(function (x) { return x.t === n.t; })[0];
          var move = q && q.pct !== null && q.pct !== undefined
            ? '<span class="move ' + (q.pct >= 0 ? "up" : "down") + '">' +
              (q.pct >= 0 ? "+" : "") + q.pct.toFixed(2) + "%</span>"
            : "";

          return '<article class="card">' +
            "<h3>" +
              '<a href="https://www.tradingview.com/symbols/' + encodeURIComponent(n.t) +
              '/" target="_blank" rel="noopener noreferrer">' + esc(n.t) + "</a>" +
              move +
            "</h3>" +
            '<div class="sector">' + esc(q && sectorLabel(q) ? sectorLabel(q) : "") + "</div>" +
            "<p>" + esc(n.summary || "") + "</p>" +
            (n.headlines && n.headlines.length
              ? "<ul>" + n.headlines.map(function (h) {
                  return "<li>" + esc(h) + "</li>";
                }).join("") + "</ul>"
              : "") +
          "</article>";
        }).join("");
      })
      .catch(function (e) {
        newsLoaded = false;      // let a later tab click try again
        statusEl.className = "status bad";
        statusEl.innerHTML = "<b>could not load news.json</b><br>" + esc(e.message) +
          " -- this tab needs the page served over http, not opened from disk";
      });
  }

  // ---------------------------------------------------------------- brief

  var briefLoaded = false;

  function pc(n) {
    if (n === null || n === undefined || isNaN(n)) return "";
    return '<span class="' + (n >= 0 ? "up" : "down") + '">' +
           (n >= 0 ? "+" : "") + Number(n).toFixed(2) + "%</span>";
  }

  function loadBrief() {
    if (briefLoaded) return;
    briefLoaded = true;

    var statusEl = document.getElementById("brief-status");
    var body = document.getElementById("brief-body");
    statusEl.textContent = "loading brief...";

    fetch("brief.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("brief.json " + r.status);
        return r.json();
      })
      .then(function (b) {
        statusEl.innerHTML = "<b>" + esc(b.subject || "") + "</b><br>" +
          "sources: " + esc((b.sources || []).join(", "));

        var html = "";

        html += '<h2><span class="num">01</span>Major indexes + oil</h2><div class="quotes">' +
          (b.indexes || []).map(function (x) {
            return '<div><div class="n">' + esc(x.name) + "</div>" +
                   '<div class="v">' + esc(x.level) + "</div>" +
                   '<div class="c">' + pc(x.pct) + "</div></div>";
          }).join("") + "</div>";

        html += '<div class="rows">' + (b.oil || []).map(function (x) {
          return '<div class="row"><span class="tk">' + esc(x.name) + "</span>" +
                 '<span class="pc">' + esc(x.level) + " " + pc(x.pct) + "</span>" +
                 '<span class="tx">' + esc(x.driver || "") + "</span></div>";
        }).join("") + "</div>";

        html += '<h2><span class="num">02</span>Sector focus, this week</h2><div class="sect">' +
          (b.sectors || []).map(function (x) {
            return '<div class="s"><h4>' + esc(x.name) +
                   '<span class="avg">' + pc(x.avg) + " avg &middot; " + x.n + " names</span></h4>" +
                   "<p>" + esc(x.note) + "</p></div>";
          }).join("") + "</div>";

        function movers(list) {
          return '<div class="rows">' + (list || []).map(function (x) {
            return '<div class="row"><span class="tk">' + esc(x.t) + "</span>" +
                   '<span class="pc">' + pc(x.pct) + "</span>" +
                   '<span class="tx">' + esc(x.catalyst) + "</span></div>";
          }).join("") + "</div>";
        }
        html += '<h2><span class="num">03</span>Winners today</h2>' + movers(b.winners);
        html += '<h2><span class="num">03</span>Losers today</h2>' + movers(b.losers);

        html += '<h2><span class="num">04</span>Macro</h2><ul class="bullets">' +
          (b.macro || []).map(function (m) {
            return "<li>" + esc(m.h) + ' <span class="when">' + esc(m.d) + "</span></li>";
          }).join("") + "</ul>";

        html += '<h2><span class="num">05</span>Your positions</h2><div class="rows">' +
          (b.holdings || []).map(function (x) {
            return '<div class="row"><span class="tk">' + esc(x.t) + "</span>" +
                   '<span class="pc">' + esc(x.price) + "<br>" + pc(x.pct) + "</span>" +
                   '<span class="tx"><b>' + esc(x.label) + "</b> &mdash; " + esc(x.headline) + "</span></div>";
          }).join("") + "</div>";

        html += '<h2><span class="num">05</span>Watchlist favorites</h2><div class="rows">' +
          (b.favorites || []).map(function (x) {
            return '<div class="row"><span class="tk">' + esc(x.t) + "</span>" +
                   '<span class="pc">' + esc(x.price) + "<br>" + pc(x.pct) + "</span>" +
                   '<span class="tx">' + esc(x.headline) + "</span></div>";
          }).join("") + "</div>";

        var v = b.volatility || {};
        html += '<h2><span class="num">06</span>Volatility &amp; catalyst context</h2>';
        if (v.declined) {
          html += '<div class="declined"><b>No trade recommendations here.</b> ' +
            "Specific option structures and strikes sized to your situation are personalized " +
            "investment advice, which Claude does not give &mdash; it is not a licensed advisor. " +
            "What follows is the factual volatility and event picture the ideas would have " +
            "been built from.</div>";
        }
        html += '<ul class="bullets">' + (v.context || []).map(function (c) {
          return "<li>" + esc(c) + "</li>";
        }).join("") + "</ul>";

        body.innerHTML = html;
      })
      .catch(function (e) {
        briefLoaded = false;
        statusEl.className = "status bad";
        statusEl.innerHTML = "<b>could not load brief.json</b><br>" + esc(e.message) +
          " -- this tab needs the page served over http, not opened from disk";
      });
  }

  // ---------------------------------------------------------------- events

  var evData = null, evLoaded = false;
  var DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];

  function ymd(d) {
    return d.getFullYear() + "-" +
           ("0" + (d.getMonth() + 1)).slice(-2) + "-" +
           ("0" + d.getDate()).slice(-2);
  }

  // Dates in the file are plain calendar days. Parsing them by hand keeps
  // them off the UTC timeline, where an evening viewer would see them
  // land a day early.
  function parseDay(iso) {
    var p = String(iso).split("-");
    return new Date(+p[0], +p[1] - 1, +p[2]);
  }

  function evKind(e) {
    var want = document.getElementById("ev-kind").value;
    if (want === "all") return true;
    if (want === "fav") return !!e.fav;
    if (want === "macro") return e.type === "macro" || e.type === "fed";
    return e.type === want;
  }

  function evChip(e) {
    var label = e.ticker
      ? '<span class="s">' + esc(e.ticker) + "</span> " +
        (e.type === "earnings" ? "earnings" : "ex-div")
      : esc(e.title);
    return '<div class="ev ' + esc(e.type) + (e.fav ? " fav" : "") + '" title="' +
           esc(e.title) + '">' + label + "</div>";
  }

  function renderMonth(events, today) {
    var first = new Date(today.getFullYear(), today.getMonth(), 1);
    var start = new Date(first);
    start.setDate(1 - first.getDay());              // back up to Sunday

    var byDay = {};
    events.forEach(function (e) {
      (byDay[e.date] = byDay[e.date] || []).push(e);
    });

    var html = '<div class="cal">' +
      DOW.map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");

    for (var i = 0; i < 42; i++) {
      var day = new Date(start);
      day.setDate(start.getDate() + i);
      var key = ymd(day);
      var out = day.getMonth() !== today.getMonth();
      var isToday = key === ymd(today);

      html += '<div class="day' + (out ? " out" : "") + (isToday ? " today" : "") + '">' +
        '<span class="d">' + day.getDate() + "</span>" +
        (byDay[key] || []).map(evChip).join("") +
      "</div>";
    }
    return html + "</div>";
  }

  function renderWeek(events, today) {
    var start = new Date(today);
    start.setDate(today.getDate() - today.getDay());

    var byDay = {};
    events.forEach(function (e) {
      (byDay[e.date] = byDay[e.date] || []).push(e);
    });

    var html = '<div class="weeklist">';
    for (var i = 0; i < 7; i++) {
      var day = new Date(start);
      day.setDate(start.getDate() + i);
      var key = ymd(day);
      var items = byDay[key] || [];

      html += '<div class="wday' + (key === ymd(today) ? " today" : "") + '">' +
        '<span class="lab">' + DOW[day.getDay()] + " " +
          (day.getMonth() + 1) + "/" + day.getDate() + "</span>" +
        '<span class="items">' +
          (items.length ? items.map(evChip).join("") : '<span class="none">-</span>') +
        "</span></div>";
    }
    return html + "</div>";
  }

  function drawEvents() {
    if (!evData) return;

    var today = new Date();
    var shown = (evData.events || []).filter(evKind);
    var range = document.getElementById("ev-range").value;

    document.getElementById("ev-body").innerHTML =
      (range === "week" ? renderWeek(shown, today) : renderMonth(shown, today)) +
      '<div class="legend">' +
        '<span class="e">Earnings</span><span class="d">Ex-dividend</span>' +
        '<span class="f">Fed</span><span class="m">Macro</span>' +
      "</div>";

    var counts = { earnings: 0, exdiv: 0, fed: 0, macro: 0 };
    (evData.events || []).forEach(function (e) {
      if (counts[e.type] !== undefined) counts[e.type]++;
    });
    document.getElementById("ev-status").innerHTML =
      "<b>" + esc(evData.generatedLabel || "") + "</b><br>" +
      counts.earnings + " earnings &middot; " + counts.exdiv + " ex-dividend &middot; " +
      (counts.fed + counts.macro) + " macro/Fed";
  }

  function loadEvents() {
    if (evLoaded) { drawEvents(); return; }
    evLoaded = true;

    fetch("events.json", { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("events.json " + r.status);
        return r.json();
      })
      .then(function (doc) { evData = doc; drawEvents(); })
      .catch(function (e) {
        evLoaded = false;
        var st = document.getElementById("ev-status");
        st.className = "status bad";
        st.innerHTML = "<b>could not load events.json</b><br>" + esc(e.message) +
          " -- this tab needs the page served over http, not opened from disk";
      });
  }

  document.getElementById("ev-range").addEventListener("change", drawEvents);
  document.getElementById("ev-kind").addEventListener("change", drawEvents);

  document.getElementById("tabs").addEventListener("click", function (e) {
    var tab = e.target.closest(".tab");
    if (!tab) return;

    var panel = tab.dataset.panel;
    [].forEach.call(document.querySelectorAll(".tab"), function (t) {
      t.classList.toggle("on", t === tab);
    });
    document.getElementById("board").hidden = panel !== "board";
    document.getElementById("news").hidden = panel !== "news";
    document.getElementById("brief").hidden = panel !== "brief";
    document.getElementById("events").hidden = panel !== "events";

    if (panel === "news") loadNews();
    if (panel === "brief") loadBrief();
    if (panel === "events") loadEvents();
  });

  render();
  reload();   // prices are never stored in this file -- fetch them on every open
})();
</script>
</body>
</html>
